name: Daily Briefing Watchdog

# Checks that today's briefing actually went out. Vercel Cron fires at
# 23:00 UTC (08:00 KST); this runs 30 minutes later so a normal run has
# time to finish. GitHub automatically emails the repo owner when a
# scheduled workflow run fails, so a failure here IS the alert — no
# extra monitoring service needed.
#
# Requires a repository secret `SITE_URL` (the deployed app's base URL,
# e.g. https://daily-briefing.vercel.app) to be set after the first
# Vercel deploy. Until then this step no-ops instead of failing.
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch: {}

jobs:
  check-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health for today's successful run
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set yet — skipping until the app is deployed."
            exit 0
          fi

          RESPONSE=$(curl -sf "$SITE_URL/api/health")
          echo "Response: $RESPONSE"

          TODAY_KST=$(TZ=Asia/Seoul date +%F)

          echo "$RESPONSE" | grep -q "\"lastSuccessfulRunDate\":\"${TODAY_KST}T" || {
            echo "::error::No successful BriefingRun found for $TODAY_KST"
            exit 1
          }
